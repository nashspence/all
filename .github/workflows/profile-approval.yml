name: Current shared profile approval
on:
  push:
    branches: [main]
    paths: ['.all/performance/approvals.json', '.github/workflows/profile-approval.yml']
  schedule:
    - cron: '53 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  approval:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.9'
      - run: python -m pip install .
      - run: all-policy performance-status
        env:
          GITHUB_TOKEN: ${{ github.token }}
